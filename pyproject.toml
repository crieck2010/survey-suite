[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "survey-suite"
version = "0.4.0"
description = "Field-to-finish computational land surveying suite: COGO, least-squares, 345 CRS registry, linework, and vector PDF plat drafting"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Charles Rieck", email = "crieck2010@users.noreply.github.com" }]
keywords = ["surveying", "geomatics", "cogo", "geodesy", "least-squares", "cad", "plat-drafting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
# The entire core computation pipeline is standard-library only!
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]
desktop = ["pyinstaller", "Pillow"]

[project.scripts]
survey-suite = "suite.app:main"
cogo = "cogo.cli:main"
field = "field.cli:main"
adjustflow = "adjustflow.cli:main"
draft = "drafting.cli:main"
crs = "crs.cli:main"
linework = "linework.cli:main"
opus = "survey_opus.cli:main"
basemap = "basemap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"
